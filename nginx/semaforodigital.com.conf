# /etc/nginx/sites-available/semaforodigital.com.conf
# Certbot añade el bloque HTTPS y el redirect automáticamente al correr:
#   certbot --nginx -d semaforodigital.com -d www.semaforodigital.com

server {
    listen 80;
    server_name semaforodigital.com www.semaforodigital.com;

    # ——— Proxy general ————————————————————————————————————————
    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade          $http_upgrade;
        proxy_set_header   Connection       'upgrade';
        proxy_set_header   Host             $host;
        proxy_set_header   X-Real-IP        $remote_addr;
        proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # ——— Asesor IA (streaming SSE) — sin buffering ————————————
    location /api/asesor {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host             $host;
        proxy_set_header   X-Real-IP        $remote_addr;
        proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_buffering    off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # ——— Assets estáticos de Next.js — caché larga —————————————
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
